[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "legal-llm-toolkit"
dynamic = ["version"]
description = "A Python framework for fine-tuning and evaluating LLMs on legal text"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Legal LLM Toolkit Contributors" }
]
keywords = [
    "llm",
    "legal",
    "nlp",
    "fine-tuning",
    "machine-learning",
    "transformers",
    "law",
    "citations",
    "anonymisation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# Preprocessing, citations, anonymisation and metrics are pure Python.
# Training and model evaluation need the extras below.
dependencies = [
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "torch>=2.1",
    "transformers>=4.46",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "datasets>=3.0",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]
qlora = [
    "legal-llm-toolkit[train]",
    "bitsandbytes>=0.43",
]
eval = [
    "torch>=2.1",
    "transformers>=4.46",
    "peft>=0.13",
    "accelerate>=1.0",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]
ner = [
    "spacy>=3.7",
]
all = [
    "legal-llm-toolkit[train,qlora,eval,ner]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.9,<0.17",  # formats Python blocks in Markdown too
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/NeilPageLaw/legal-llm-toolkit"
Documentation = "https://github.com/NeilPageLaw/legal-llm-toolkit#readme"
Repository = "https://github.com/NeilPageLaw/legal-llm-toolkit"
Issues = "https://github.com/NeilPageLaw/legal-llm-toolkit/issues"
Changelog = "https://github.com/NeilPageLaw/legal-llm-toolkit/blob/main/CHANGELOG.md"

[project.scripts]
legalkit = "legalkit.cli:main"

[tool.hatch.version]
path = "legalkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["legalkit"]

[tool.hatch.build.targets.sdist]
include = [
    "/legalkit",
    "/tests",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ml: end-to-end tests that need the training extras (torch, transformers, peft, trl)"]

[tool.coverage.run]
source = ["legalkit"]

[tool.coverage.report]
show_missing = true
skip_covered = true
