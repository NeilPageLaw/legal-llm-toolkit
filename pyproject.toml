[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-llm-toolkit"
version = "0.1.0"
description = "A Python framework for fine-tuning and evaluating LLMs on legal text"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Legal LLM Toolkit Contributors" }
]
keywords = [
    "llm",
    "legal",
    "nlp",
    "fine-tuning",
    "machine-learning",
    "transformers",
    "law"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "transformers>=4.36.0",
    "datasets>=2.14.0",
    "peft>=0.7.0",
    "torch>=2.0.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    "trl>=0.7.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    "regex>=2023.0.0",
    "spacy>=3.7.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]
all = [
    "legal-llm-toolkit[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/ThePagePage/legal-llm-toolkit"
Documentation = "https://github.com/ThePagePage/legal-llm-toolkit#readme"
Repository = "https://github.com/ThePagePage/legal-llm-toolkit"
Issues = "https://github.com/ThePagePage/legal-llm-toolkit/issues"

[project.scripts]
legalkit = "legalkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["legalkit"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=legalkit --cov-report=term-missing"
